name: Build & Push gw-collector
on:
  push:
    branches:
      - mariadb
    paths:
      - 'gw-collector/**'
      - '.github/workflows/gw-collector.yml'
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./gw-collector
          platforms: linux/amd64
          push: true
          tags: green0ran9e/construction-app:gw-collector
